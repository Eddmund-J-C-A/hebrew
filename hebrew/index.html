:root[data-theme="dark"]{--bg:#15181f;--card:#1e222b;--ink:#eceae4;--mut:#9aa1ad;--line:#2d333f;--acc:#7aa7ff;--accink:#10131a;--ok:#6fcf97;--bad:#ff8a7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Noto Sans Arabic",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 12px}h3{margin:0 0 6px}
#nav{display:flex;gap:6px;margin-bottom:10px}
#nav button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.95rem;cursor:pointer}
#nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#langs,.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
#langs button,.seg button{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:.9rem}
#langs button.on,.seg button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
#keys{display:none;flex-wrap:wrap;gap:5px;margin-bottom:12px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.key{min-width:38px;padding:6px 8px;font-size:1.1rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button.pri{background:var(--acc);color:var(--accink);border:0;padding:11px 18px;border-radius:10px;font-size:1rem;cursor:pointer;margin-top:14px}
button.pri.ok{background:var(--ok);color:#fff}button.pri.bad{background:var(--bad);color:#fff}
button.sec,a.sec{background:transparent;color:var(--ink);border:1px solid var(--line);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:.9rem;text-decoration:none;display:inline-block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.big{font-size:1.5rem}
.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:4px}
.mut{color:var(--mut);font-size:.9rem}
.q{text-align:center;padding:28px 12px}.q .big{font-size:2.2rem;margin:8px 0}
.ans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.stat{display:flex;gap:16px;justify-content:center;margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:30px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.9rem}
</style></head><body><main>
